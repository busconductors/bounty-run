name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: tui/go.mod
          cache-dependency-path: tui/go.sum
      - name: Check the tag is on master and matches every version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master
          version="${TAG#v}"
          engine="$(python -c 'import runner; print(runner.__version__)')"
          tui="$(sed -n 's/^const version = "\(.*\)"$/\1/p' tui/cmd/bounty-tui/main.go)"
          test "$engine" = "$version"
          test "$tui" = "$version"
          grep -qF "## [$version]" CHANGELOG.md
      - run: python -m pip install -r requirements-dev.txt
      - run: make lint PYTHON=python
      - run: make test PYTHON=python

  build:
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-22.04-arm
            arch: arm64
          # x86_64 Linux is also the Windows v1 path, run inside WSL2.
          - runner: ubuntu-22.04
            arch: amd64
    env:
      TAG: ${{ github.ref_name }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: tui/go.mod
          cache-dependency-path: tui/go.sum
      - run: python -m pip install -r requirements-dev.txt
      - run: make engine PYTHON=python
      - run: make tui
      - name: Check the TUI reports the tagged version
        run: test "$(bin/bounty-tui --version)" = "bounty-tui ${TAG#v}"
      - name: Archive engine and TUI
        run: |
          mkdir -p release
          tar -C dist -czf "release/bounty-run-engine-$TAG-linux-$ARCH.tar.gz" bounty-run
          tar -C bin -czf "release/bounty-tui-$TAG-linux-$ARCH.tar.gz" bounty-tui

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v h="## [$version]" 'index($0, h) == 1 { f = 1; next } /^## \[/ { f = 0 } f' CHANGELOG.md > notes.md
          test -s notes.md
          printf '\n---\nBinaries are unsigned. Windows users run the Linux x86_64 build inside WSL2.\n' >> notes.md
          (cd release && sha256sum -- * > SHA256SUMS)

          gh release create "$TAG" release/* --verify-tag --title "Bounty Runner $TAG" --notes-file notes.md

# Keep in step with the oldest Python in the CI matrix: this stops pyupgrade
# rules from rewriting code to syntax or stdlib names that version lacks.
target-version = "py310"
line-length = 120
extend-exclude = ["runner/vendor"]

[lint]
select = ["E", "F", "W", "I", "UP"]

[lint.per-file-ignores]
# These modules hold long human-readable finding/report narrative strings;
# wrapping them to the column limit would hurt readability and grep-ability.
"runner/narrative.py" = ["E501"]
"runner/engagement_report.py" = ["E501"]
